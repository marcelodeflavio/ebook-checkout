
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Subscrição mensal do ebook de Marcelo de Flávio.">
  <title>O Rapaz que Guardava Silêncios</title>

  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
    }

    .cover {
      width: 150px;
      height: 195px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
      padding: 16px;
      background: linear-gradient(145deg, #475569, #0f172a);
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.5;
    }

    h1 { font-size: 26px; line-height: 1.3; }
    p { color: #cbd5e1; line-height: 1.7; }

    .price {
      margin: 24px 0;
      font-size: 30px;
      font-weight: bold;
    }

    .price span {
      font-size: 14px;
      font-weight: normal;
      color: #cbd5e1;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    #status {
      min-height: 24px;
      font-size: 14px;
    }

    small { color: #94a3b8; }
  </style>
</head>

<body>
  <main class="card">
    <div class="cover">
      O RAPAZ QUE<br>
      GUARDAVA<br>
      SILÊNCIOS
    </div>

    <h1>O Rapaz que Guardava Silêncios</h1>
    <p>Um ebook de Marcelo de Flávio.</p>

    <div class="price">
      $5.00 <span>USD / mês</span>
    </div>

    <p>
      Subscrição mensal com renovação automática.
      Podes cancelar de acordo com as condições apresentadas no checkout.
    </p>

    <button id="buyButton" type="button">
      Subscrever agora
    </button>

    <p id="status" role="status"></p>
    <small>Pagamento de teste — Paddle Sandbox</small>
  </main>

  <script>
    const CLIENT_TOKEN = "test_c8e652c0a430cdd6af7b3a9f5d6";
    const PRICE_ID = "pri_01m4r6mr89jf9t8egqc3x3zk60";

    const button = document.getElementById("buyButton");
    const status = document.getElementById("status");
    let initialized = false;

    if (CLIENT_TOKEN === "test_c8e652c0a430cdd6af7b3a9f5d6") {
      status.textContent = "Configura o token de teste antes de comprar.";
      button.disabled = true;
    } else {
      try {
        Paddle.Environment.set("sandbox");

        Paddle.Initialize({
          token: CLIENT_TOKEN
        });

        initialized = true;
      } catch (error) {
        status.textContent = "Erro ao iniciar o checkout. Verifica a configuração.";
      }
    }

    button.addEventListener("click", function () {
      if (!initialized) return;

      try {
        Paddle.Checkout.open({
          items: [{
            priceId: PRICE_ID,
            quantity: 1
          }]
        });
      } catch (error) {
        status.textContent = "Não foi possível abrir o checkout.";
      }
    });
  </script>
</body>
</html>
